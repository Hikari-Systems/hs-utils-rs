[package]
name = "hs-utils"
version = "0.29.0"
edition = "2021"

[features]
db = ["dep:sqlx"]
# Generic realtime pub/sub backplane (EventBus<E> + Postgres LISTEN/NOTIFY +
# in-memory fallback). Needs a Postgres pool (db) and the Tokio runtime for the
# background LISTEN task.
pubsub = ["db", "tokio/rt", "tokio/sync", "tokio/time"]
# Adds the axum Server-Sent Events helper (`pubsub::sse_stream`).
pubsub-axum = ["pubsub", "dep:axum", "dep:tokio-stream"]
web = ["dep:actix-web", "dep:actix-service", "dep:actix-http", "dep:futures-util"]
# Framework-free RFC 7591 DCR proxy primitives. Pick an adapter feature below
# to wire it into your HTTP framework of choice.
mcp-auth = ["dep:reqwest"]
mcp-auth-actix = ["mcp-auth", "web"]
mcp-auth-axum = ["mcp-auth", "dep:axum"]
# Full MCP resource-server stack: JWT verification, JWKS cache,
# Kratos-backed user resolver, RFC 9728 metadata routes, axum auth
# middleware. Pulls the axum DCR adapter so the same router can mount
# /register too.
mcp-resource-server = [
    "mcp-auth-axum",
    "dep:jsonwebtoken",
    "dep:moka",
    "dep:tokio",
    "dep:async-trait",
    "dep:uuid",
]
# Browser (Authorization-Code) OAuth2 login with a cookie session, backed by
# Kratos (reuses the resource-server's KratosUserResolver + claims).
web-login = ["mcp-resource-server"]
# Redis cross-replica session store for web-login, over EITHER a Sentinel
# cluster or a single node. Sentinel reuses the FalkorDB cluster (it is just
# redis) on a dedicated db index; the single-node URL mode exists so a local
# compose stack can exercise the same store as production without standing up a
# Sentinel quorum. Either way browser login survives multiple replicas behind a
# load balancer. Compile it alongside web-login-postgres and let
# `session.store` pick between them at runtime.
web-login-redis = ["web-login", "dep:redis"]
# Postgres cross-replica session store for web-login. Persists sessions in a
# `web_sessions` table over the service's existing PgPool, so browser login
# survives multiple replicas behind a load balancer without a redis dependency.
web-login-postgres = ["web-login", "db"]
# mcp-data-service-backed rmcp SessionStore for cross-replica streamable-HTTP
# sessions. Pulls rmcp to implement its SessionStore trait.
mcp-session-store = ["mcp-resource-server", "dep:rmcp"]
# Composable GraphQL controller toolkit: CoreConfig/CoreServices, shared
# GqlContext, shared async-graphql types + mergeable resolver fragments
# (loggedInUser, checkTermsAccepted/acceptTerms), terms login-hydration, and a
# Kratos admin client. Controllers keep ownership of their own AppState, schema
# build and handlers; they pull these elements in. Requires web-login for the
# session store + KratosUserResolver/ReqwestKratosFetcher.
controller = ["web-login", "dep:async-graphql", "dep:async-graphql-axum", "dep:chrono"]
# Adds the Stripe + payment-data clients and the payments resolver fragments
# (checkPaidState, listSubscriptionPlans, subscription mutations) on top of the
# controller toolkit. Stripe is a hand-rolled reqwest client (no `stripe` crate);
# hmac/sha2/hex back the webhook signature check.
controller-payments = ["controller", "dep:hmac", "dep:sha2", "dep:hex"]
# OpenTelemetry tracing (OTLP/http-protobuf → Honeycomb) bridged into the
# existing `tracing` macros, plus W3C traceparent propagation helpers. Inert
# until `otel.enabled` is set in config, so enabling the feature alone cannot
# change runtime behaviour.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:http",
    "dep:reqwest13",
    "dep:rustls",
]
# Adds `otel::axum_trace_layer()` — a tower-http TraceLayer emitting HTTP
# semantic-convention attributes and adopting the inbound traceparent.
otel-axum = ["otel", "dep:axum", "dep:tower-http"]
# Kratos post-flow webhook that ingests a provider avatar into image-service
# (`POST /api/hooks/post-flow`). Needs axum, and reqwest/multipart to upload the
# image. Nothing else.
#
# It has its own feature because it has no relationship to Hydra. Until v0.29.0
# it was gated behind `consent-bridge` purely by adjacency — `avatar_hook` sits
# next to `hydra_bridge` in lib.rs and its dependencies were a subset of that
# feature's. In fact `reqwest/multipart` was in that set BECAUSE of this module;
# `hydra_bridge` never uses multipart. So the feature's dependency list was
# shaped by a module its name does not mention.
#
# The cost was real: a service wanting Kratos avatar ingest had to compile an
# entire Hydra login/consent provider it does not use. botsafely-controller is
# exactly that case — no `hydra` block, login through `web_login` — so the
# capability was simply unreachable for it.
avatar-hook = ["dep:axum", "dep:reqwest", "reqwest/multipart"]
# Ory Hydra login/consent/logout provider bridge (axum). A reusable port of the
# hs-login-controller bridge: resolves the Kratos identity and accepts/rejects
# Hydra login/consent/logout challenges via Hydra's admin API. Mount its router
# on a public path (`/api/oauth/*`).
#
# Implies `avatar-hook`: the two are genuinely used together (the bridge
# surfaces as a claim the `pictureId` this hook writes), and keeping the
# implication means anything already enabling `consent-bridge` still finds
# `avatar_hook` where it expects it.
consent-bridge = ["dep:axum", "dep:reqwest", "avatar-hook"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"], optional = true }
actix-web = { version = "4", optional = true }
actix-service = { version = "2", optional = true }
actix-http = { version = "3", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# `matched-path` is required by otel::axum_trace_layer, which names spans after
# the route TEMPLATE rather than the concrete path. Declared here rather than
# left to feature unification: with only `otel-axum` on, axum has no
# matched-path and the build fails — it compiled during development purely
# because `controller`/`async-graphql-axum` happened to turn it on.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"], optional = true }
jsonwebtoken = { version = "9", default-features = false, optional = true }
moka = { version = "0.12", default-features = false, features = ["future"], optional = true }
tokio = { version = "1", default-features = false, features = ["sync", "time"], optional = true }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"], optional = true }
async-trait = { version = "0.1", optional = true }
uuid = { version = "1", default-features = false, features = ["v4"], optional = true }
rmcp = { version = "1.6", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
# `tokio-rustls-comp` is load-bearing, not tidiness: without a TLS feature the
# redis crate compiles `rediss://` URLs and `TlsMode` out entirely — a URL is
# rejected at parse time and `RedisSentinelConfig.tls` is silently inert. rustls
# to match sqlx (`runtime-tokio-rustls`), reqwest (`rustls-tls`) and the otel
# exporter, so the process has one TLS stack rather than three.
redis = { version = "0.27", features = ["tokio-comp", "sentinel", "connection-manager", "tokio-rustls-comp"], optional = true }
async-graphql = { version = "7", optional = true }
async-graphql-axum = { version = "7", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"], optional = true }
# Feature notes, each one load-bearing:
#  * reqwest-BLOCKING-client — the SDK's batch span processor runs on a dedicated
#    OS thread with no Tokio reactor, so the async client panics there ("there is
#    no reactor running") on a background thread: service stays up, exports nothing.
#    Do NOT also enable `reqwest-client`; the exporter prefers the async client
#    whenever that feature is on, which reintroduces exactly that panic.
#  * internal-logs — routes the SDK's own export errors into `tracing`. Without it
#    that failure, and the TLS one below, are completely silent.
# TLS is NOT configured through an otlp feature here — see the `reqwest13` dep.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "internal-logs"], optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["tracing-log"], optional = true }
# opentelemetry-otlp pulls its OWN reqwest 0.13, which does NOT feature-unify with
# the reqwest 0.12 the rest of this crate uses. Left alone that copy has no TLS
# backend at all: every HTTPS export to api.honeycomb.io fails while plain-HTTP
# endpoints appear to work. We enable TLS on it here rather than via an otlp
# feature, because both otlp TLS features are unusable:
#   * `reqwest-rustls-webpki-roots` does not resolve — opentelemetry-http 0.32.0
#     asks for a `reqwest/webpki-roots` feature that reqwest 0.13 dropped.
#   * `reqwest-rustls` resolves but turns on reqwest's `default-tls`, which drags
#     in aws-lc-rs. aws-lc-sys needs cmake, and the `rust:1-bookworm` builder
#     image has no cmake — that breaks the Docker build of every service.
# `rustls-no-provider` gives rustls with NO crypto provider selected, so we pick
# ring below — the same provider reqwest 0.12/sqlx already use here. It leaves
# root certs to rustls-platform-verifier (system store), so the runtime image
# needs ca-certificates; the service Dockerfiles (debian:bookworm-slim) install it.
# `otel::init` installs ring as the process-default provider; without that, client
# construction inside the exporter fails at runtime.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tower-http = { version = "0.6", default-features = false, features = ["trace"], optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread"] }
# `ServiceExt::oneshot`, so the otel-axum tests can drive the REAL TraceLayer
# instead of testing its helpers in isolation — a correct `redact_query` proves
# nothing if `make_span` stops calling it. Already in the tree transitively via
# axum/tower-http, so this adds no download.
tower = { version = "0.5", features = ["util"] }
